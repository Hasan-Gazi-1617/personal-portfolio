{% extends "base.html" %}{% block title %}{{ exam.title }}{% endblock %}{% block content %}<section style="padding:120px 0 60px;background:var(--bg-primary);color:var(--text-primary)"><div class="container" style="max-width:1000px"><h1>{{ exam.title }}</h1><p id="timer" data-minutes="{{ exam.duration_minutes }}">{{ exam.duration_minutes }} minutes</p><form id="examForm" method="post" action="{% url 'bcs_exam_submit' attempt.id %}">{% csrf_token %}{% for q in questions %}<article style="padding:18px;margin:14px 0;border:1px solid var(--border);border-radius:12px;background:var(--bg-card)"><h5>{{ forloop.counter }}. {{ q.prompt }}</h5><label><input type="radio" name="q_{{ q.id }}" value="A"> A. {{ q.option_a }}</label><br><label><input type="radio" name="q_{{ q.id }}" value="B"> B. {{ q.option_b }}</label><br><label><input type="radio" name="q_{{ q.id }}" value="C"> C. {{ q.option_c }}</label><br><label><input type="radio" name="q_{{ q.id }}" value="D"> D. {{ q.option_d }}</label></article>{% endfor %}<button class="btn btn-success btn-lg" type="submit" onclick="return confirm('Submit your examination?')">Submit Examination</button></form></div></section><script>(function(){const el=document.getElementById('timer'),form=document.getElementById('examForm');let left=Number(el.dataset.minutes)*60;function tick(){const m=Math.floor(left/60),s=left%60;el.textContent='Time remaining: '+m+':'+String(s).padStart(2,'0');if(left<=0){form.submit();return}left--}tick();setInterval(tick,1000)})();</script>{% endblock %}
