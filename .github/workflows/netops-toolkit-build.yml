name: Build NetOps Toolkit

on:
  pull_request:
    paths:
      - "netops-toolkit/**"
      - ".github/workflows/netops-toolkit-build.yml"
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "netops-v*"

permissions:
  contents: write

concurrency:
  group: netops-toolkit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install application dependencies
        run: python -m pip install -r netops-toolkit/requirements.txt

      - name: Generate Windows and macOS app icon
        if: runner.os != 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtGui import QGuiApplication,QImage,QPainter; from PySide6.QtSvg import QSvgRenderer; app=QGuiApplication([]); r=QSvgRenderer('netops-toolkit/assets/netops-toolkit.svg'); assert r.isValid(), 'Invalid SVG icon'; i=QImage(256,256,QImage.Format.Format_ARGB32); i.fill(0); p=QPainter(i); r.render(p); p.end(); assert i.save('netops-toolkit/assets/netops-toolkit.png'), 'Could not save PNG icon'; print('PNG icon generated successfully')"

      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NetOpsToolkit --paths netops-toolkit --hidden-import ui.main_window --hidden-import core.network_info --hidden-import core.worker --hidden-import modules.diagnostics.ping --hidden-import modules.ip_calculator.page --hidden-import modules.network_analyzer.page --hidden-import modules.network_analyzer.pcap_page --hidden-import modules.website_analyzer.lookup --hidden-import modules.fiber_olt.page --hidden-import modules.bandwidth.page --hidden-import modules.noc_reference.page --collect-all scapy --add-data "netops-toolkit/ui/themes;ui/themes" --add-data "netops-toolkit/assets/netops-toolkit.png;assets" netops-toolkit/app.py

      - name: Package Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/NetOpsToolkit.exe NetOpsToolkit-Windows.exe

      - name: Build Linux AppImage and Debian installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin libpcap0.8 libpcap0.8-dev
          mkdir -p netops-toolkit/assets
          rsvg-convert -w 256 -h 256 netops-toolkit/assets/netops-toolkit.svg > netops-toolkit/assets/netops-toolkit.png

          python -m compileall -q netops-toolkit
          pyinstaller --noconfirm --clean --onefile --windowed --name NetOpsToolkit \
            --paths netops-toolkit \
            --hidden-import ui.main_window \
            --hidden-import core.network_info \
            --hidden-import core.worker \
            --hidden-import modules.diagnostics.ping \
            --hidden-import modules.ip_calculator.page \
            --hidden-import modules.network_analyzer.page --hidden-import modules.network_analyzer.pcap_page \
            --hidden-import modules.website_analyzer.lookup --hidden-import modules.fiber_olt.page --hidden-import modules.bandwidth.page --hidden-import modules.noc_reference.page \
            --collect-all scapy \
            --add-data "netops-toolkit/ui/themes:ui/themes" \
            --add-data "netops-toolkit/assets/netops-toolkit.png:assets" \
            netops-toolkit/app.py

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          install -m 755 dist/NetOpsToolkit AppDir/usr/bin/NetOpsToolkit
          install -m 644 netops-toolkit/assets/netops-toolkit.png AppDir/netops-toolkit.png
          install -m 644 netops-toolkit/assets/netops-toolkit.png AppDir/usr/share/icons/hicolor/256x256/apps/netops-toolkit.png

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/NetOpsToolkit" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/netops-toolkit.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NetOps Toolkit
          Comment=Network Operations Toolkit
          Exec=NetOpsToolkit
          Icon=netops-toolkit
          Categories=Network;Utility;
          Terminal=false
          StartupNotify=true
          StartupWMClass=NetOpsToolkit
          EOF

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            --output appimagetool
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir NetOpsToolkit-Linux.AppImage
          chmod +x NetOpsToolkit-Linux.AppImage

          # Build a Debian package whose pre-install hook stops an older running copy.
          VERSION="${GITHUB_REF_NAME#netops-v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.2.1"; fi
          PKG="netops-deb"
          mkdir -p "$PKG/DEBIAN" "$PKG/opt/netops-toolkit" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/256x256/apps"
          install -m 755 dist/NetOpsToolkit "$PKG/opt/netops-toolkit/NetOpsToolkit"
          install -m 644 netops-toolkit/assets/netops-toolkit.png \
            "$PKG/usr/share/icons/hicolor/256x256/apps/netops-toolkit.png"
          cat > "$PKG/usr/share/applications/netops-toolkit.desktop" <<'EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=NetOps Toolkit
          Comment=Network Operations Toolkit
          Exec=/opt/netops-toolkit/NetOpsToolkit
          Icon=netops-toolkit
          Terminal=false
          Categories=Network;Utility;
          StartupNotify=true
          StartupWMClass=NetOpsToolkit
          EOF

          cat > "$PKG/DEBIAN/preinst" <<'EOF'
          #!/bin/sh
          set -e
          # Do not leave an older in-memory copy running across an upgrade.
          if command -v pkill >/dev/null 2>&1; then
            pkill -TERM -x NetOpsToolkit 2>/dev/null || true
            for attempt in 1 2 3 4 5; do
              if ! pgrep -x NetOpsToolkit >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done
            pkill -KILL -x NetOpsToolkit 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG/DEBIAN/preinst"

          cat > "$PKG/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG/DEBIAN/postinst"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: netops-toolkit
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: libpcap0.8
          Maintainer: NetOps Toolkit
          Description: Cross-platform network operations toolkit
           Desktop application for network diagnostics and IP calculations.
          EOF
          dpkg-deb --build --root-owner-group "$PKG" NetOpsToolkit-Linux.deb

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name NetOpsToolkit --paths netops-toolkit --hidden-import ui.main_window --hidden-import core.network_info --hidden-import core.worker --hidden-import modules.diagnostics.ping --hidden-import modules.ip_calculator.page --hidden-import modules.network_analyzer.page --hidden-import modules.network_analyzer.pcap_page --hidden-import modules.website_analyzer.lookup --hidden-import modules.fiber_olt.page --hidden-import modules.bandwidth.page --hidden-import modules.noc_reference.page --collect-all scapy --add-data "netops-toolkit/ui/themes:ui/themes" --add-data "netops-toolkit/assets/netops-toolkit.png:assets" netops-toolkit/app.py
          hdiutil create -volname "NetOps Toolkit" -srcfolder dist/NetOpsToolkit.app -ov -format UDZO NetOpsToolkit-macOS.dmg

      - name: Upload platform installer
        uses: actions/upload-artifact@v4
        with:
          name: NetOpsToolkit-${{ matrix.platform }}
          path: NetOpsToolkit-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/netops-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: NetOpsToolkit-*
          path: release-assets
          merge-multiple: true

      - name: Publish all installers together
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetOps Toolkit ${{ github.ref_name }}
          files: release-assets/*
