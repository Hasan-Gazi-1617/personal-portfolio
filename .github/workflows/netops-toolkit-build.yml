name: Build NetOps Toolkit

on:
  pull_request:
    paths:
      - "netops-toolkit/**"
      - ".github/workflows/netops-toolkit-build.yml"
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "netops-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install application dependencies
        run: python -m pip install -r netops-toolkit/requirements.txt

      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NetOpsToolkit --add-data "netops-toolkit/ui/themes;ui/themes" netops-toolkit/app.py

      - name: Package Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/NetOpsToolkit.exe NetOpsToolkit-Windows.exe

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NetOpsToolkit --add-data "netops-toolkit/ui/themes:ui/themes" netops-toolkit/app.py

          mkdir -p AppDir/usr/bin
          cp dist/NetOpsToolkit AppDir/usr/bin/NetOpsToolkit
          chmod +x AppDir/usr/bin/NetOpsToolkit

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/NetOpsToolkit" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/netops-toolkit.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NetOps Toolkit
          Exec=NetOpsToolkit
          Categories=Utility;
          Icon=netops-toolkit
          Terminal=false
          EOF

          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 256 -h 256 static/img/netops-toolkit-preview.svg > AppDir/netops-toolkit.png

          curl --fail --location --retry 3 \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            --output appimagetool
          chmod +x appimagetool

          # Extract-and-run avoids requiring FUSE on the GitHub Actions runner.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir NetOpsToolkit-Linux.AppImage
          chmod +x NetOpsToolkit-Linux.AppImage

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name NetOpsToolkit --add-data "netops-toolkit/ui/themes:ui/themes" netops-toolkit/app.py
          hdiutil create -volname "NetOps Toolkit" -srcfolder dist/NetOpsToolkit.app -ov -format UDZO NetOpsToolkit-macOS.dmg

      - name: Upload platform installer
        uses: actions/upload-artifact@v4
        with:
          name: NetOpsToolkit-${{ matrix.platform }}
          path: NetOpsToolkit-${{ matrix.platform }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/netops-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: NetOpsToolkit-*
          path: release-assets
          merge-multiple: true

      - name: Publish all installers together
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'netops-v0.1.0' }}
          name: NetOps Toolkit ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: release-assets/*
