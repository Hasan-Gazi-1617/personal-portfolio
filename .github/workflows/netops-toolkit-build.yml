name: Build NetOps Toolkit

on:
  pull_request:
    paths:
      - "netops-toolkit/**"
      - ".github/workflows/netops-toolkit-build.yml"
  workflow_dispatch:
  push:
    tags:
      - "netops-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install application dependencies
        run: python -m pip install -r netops-toolkit/requirements.txt

      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: pyinstaller --noconfirm --clean --onefile --windowed --name NetOpsToolkit --add-data "netops-toolkit/ui/themes;ui/themes" netops-toolkit/app.py

      - name: Package Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/NetOpsToolkit.exe NetOpsToolkit-Windows.exe

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NetOpsToolkit --add-data "netops-toolkit/ui/themes:ui/themes" netops-toolkit/app.py
          mkdir -p AppDir/usr/bin
          cp dist/NetOpsToolkit AppDir/usr/bin/NetOpsToolkit
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/NetOpsToolkit" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/netops-toolkit.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NetOps Toolkit
          Exec=NetOpsToolkit
          Icon=netops-toolkit
          Categories=Network;Utility;
          Terminal=false
          EOF
          cp netops-toolkit-preview.svg AppDir/netops-toolkit.svg 2>/dev/null || cp static/img/netops-toolkit-preview.svg AppDir/netops-toolkit.svg
          curl -L "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir NetOpsToolkit-Linux.AppImage

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name NetOpsToolkit --add-data "netops-toolkit/ui/themes:ui/themes" netops-toolkit/app.py
          hdiutil create -volname "NetOps Toolkit" -srcfolder dist/NetOpsToolkit.app -ov -format UDZO NetOpsToolkit-macOS.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetOpsToolkit-${{ matrix.platform }}
          path: NetOpsToolkit-${{ matrix.platform }}.*

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/netops-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetOps Toolkit ${{ github.ref_name }}
          files: NetOpsToolkit-${{ matrix.platform }}.*
